<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - 此卡片不在卡組中 | Sebulur</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0a0a0d">
    <meta name="description" content="找不到您要的頁面。返回 Sebulur 首頁。">
    <meta name="robots" content="noindex, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent: #ff2b4d;
            --display-font: 'Oswald', 'Noto Sans TC', sans-serif;
        }

        body {
            font-family: 'Poppins', 'Noto Sans TC', sans-serif;
            color: #e8e8ea;
            background: #0a0a0d;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 40px 6vw;
            overflow-x: hidden;
            position: relative;
        }

        a { text-decoration: none; color: inherit; }

        .bg-glow {
            position: fixed;
            width: 620px; height: 620px;
            border-radius: 50%;
            pointer-events: none;
            transition: transform .6s cubic-bezier(.2, .7, .3, 1);
        }
        .bg-glow-1 {
            top: -190px; left: -170px;
            background: radial-gradient(circle, rgba(255, 43, 77, .16), transparent 70%);
        }
        .bg-glow-2 {
            bottom: -200px; right: -180px;
            background: radial-gradient(circle, rgba(80, 60, 255, .12), transparent 70%);
        }

        .wrap {
            position: relative;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 64px;
            align-items: center;
            max-width: 900px;
        }

        /* ── 破損的卡背 ── */
        .stage { perspective: 900px; }

        .card {
            position: relative;
            width: 260px;
            aspect-ratio: 3 / 4.2;
            border-radius: 18px;
            transform-style: preserve-3d;
            transform:
                rotateX(calc(var(--rx, 6) * 1deg))
                rotateY(calc(var(--ry, -10) * 1deg));
            transition: transform .5s cubic-bezier(.2, .7, .3, 1);
            animation: floaty 6s ease-in-out infinite;
        }

        @keyframes floaty {
            0%, 100% { translate: 0 0; }
            50% { translate: 0 -14px; }
        }

        .card-face {
            position: absolute; inset: 0;
            border-radius: 18px;
            border: 2px solid rgba(255, 43, 77, .5);
            background:
                repeating-conic-gradient(from 0deg at 50% 50%,
                    rgba(255, 43, 77, .1) 0deg 12deg, transparent 12deg 24deg),
                radial-gradient(circle at 50% 42%, #2b1620, #16121b 55%, #0a0a0d);
            box-shadow:
                inset 0 0 60px rgba(0, 0, 0, .65),
                0 34px 70px rgba(0, 0, 0, .6);
            display: grid; place-items: center;
            overflow: hidden;
        }

        .card-face::before {
            content: '';
            position: absolute; inset: 14px;
            border: 1px solid rgba(255, 192, 67, .22);
            border-radius: 11px;
        }

        .card-logo {
            font-family: var(--display-font);
            font-size: 78px; font-weight: 700;
            color: rgba(255, 43, 77, .5);
            text-shadow: 0 0 26px rgba(255, 43, 77, .55);
        }

        /* 裂痕 */
        .crack { position: absolute; inset: 0; pointer-events: none; }
        .crack::before,
        .crack::after {
            content: '';
            position: absolute;
            width: 2px;
            background: linear-gradient(180deg, transparent, rgba(255, 255, 255, .7), transparent);
            box-shadow: 0 0 10px rgba(255, 255, 255, .55);
        }
        .crack::before { left: 46%; top: -4%; height: 62%; transform: rotate(12deg); }
        .crack::after { left: 58%; top: 50%; height: 56%; transform: rotate(-16deg); }

        .card-stamp {
            position: absolute; bottom: 24px; left: 50%;
            transform: translateX(-50%) rotate(-6deg);
            padding: 6px 16px;
            border: 2px solid rgba(255, 43, 77, .75);
            border-radius: 4px;
            font-family: var(--display-font);
            font-size: 12px; letter-spacing: .24em;
            color: rgba(255, 43, 77, .9);
            background: rgba(10, 10, 13, .6);
            white-space: nowrap;
        }

        /* ── 右側文字 ── */
        .label {
            font-family: var(--display-font);
            font-size: 13px; letter-spacing: .3em;
            text-transform: uppercase; color: rgba(255, 255, 255, .4);
            margin-bottom: 14px;
        }

        .code {
            font-family: var(--display-font);
            font-size: clamp(76px, 14vw, 150px);
            font-weight: 700; line-height: .9;
            background: linear-gradient(135deg, #fff 10%, var(--accent) 75%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 14px;
        }

        h1 {
            font-family: var(--display-font);
            font-size: clamp(26px, 3.6vw, 38px);
            font-weight: 600; text-transform: uppercase;
            letter-spacing: .02em; margin-bottom: 16px;
        }

        .msg {
            color: rgba(255, 255, 255, .55);
            font-size: 16px; line-height: 1.75;
            margin-bottom: 34px; max-width: 440px;
        }

        .btns { display: flex; gap: 14px; flex-wrap: wrap; }

        .btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 15px 32px; border-radius: 4px;
            font-family: var(--display-font); font-size: 14px; font-weight: 600;
            letter-spacing: .12em; text-transform: uppercase;
            transition: all .25s ease; cursor: pointer;
        }
        .btn-primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
        .btn-primary:hover { box-shadow: 0 12px 30px rgba(255, 43, 77, .45); transform: translateY(-2px); }
        .btn-outline { border: 1px solid rgba(255, 255, 255, .22); color: #e8e8ea; background: transparent; }
        .btn-outline:hover { border-color: #fff; background: rgba(255, 255, 255, .05); transform: translateY(-2px); }

        @media (max-width: 760px) {
            .wrap { grid-template-columns: 1fr; gap: 40px; justify-items: center; text-align: center; }
            .msg { margin-left: auto; margin-right: auto; }
            .btns { justify-content: center; }
            .card { width: 210px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .card { animation: none; transition: none; }
        }
    </style>
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="wrap">
        <div class="stage">
            <div class="card" id="card">
                <div class="card-face">
                    <span class="card-logo">S</span>
                    <span class="card-stamp">Not in deck</span>
                    <span class="crack"></span>
                </div>
            </div>
        </div>

        <div>
            <p class="label">Card Error</p>
            <div class="code">404</div>
            <h1>此卡片不在卡組中</h1>
            <p class="msg">
                你翻到的這張卡不存在，可能已經從卡組移除，或是網址輸入有誤。<br>
                回到主牌堆重新選一張吧。
            </p>
            <div class="btns">
                <a href="index.html" class="btn btn-primary">回到首頁</a>
                <a href="artists.html" class="btn btn-outline">查看 DJ 卡組</a>
            </div>
        </div>
    </div>

    <script>
        // 卡片跟著游標轉動，背景光暈輕微視差
        (function () {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            const card = document.getElementById('card');
            const glows = document.querySelectorAll('.bg-glow');

            document.addEventListener('pointermove', function (e) {
                const x = e.clientX / window.innerWidth - 0.5;
                const y = e.clientY / window.innerHeight - 0.5;

                card.style.setProperty('--ry', (x * 26).toFixed(1));
                card.style.setProperty('--rx', (-y * 20).toFixed(1));

                glows[0].style.transform = 'translate(' + (x * 40) + 'px,' + (y * 40) + 'px)';
                glows[1].style.transform = 'translate(' + (-x * 40) + 'px,' + (-y * 40) + 'px)';
            });
        })();
    </script>
</body>
</html>
